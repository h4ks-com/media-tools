name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: make quality

  publish:
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest
            type=sha
      # We build once and push the loaded image, so the registry gets the bytes we tested.
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          load: true
          tags: |
            media-tools:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # We run the image as the pod does, so file modes and the missing network break the build.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke --user 1000:1000 --read-only --tmpfs /tmp --network none media-tools:smoke
          docker exec -i smoke python - <<'EOF'
          import io
          import struct
          import time
          import urllib.request

          from PIL import Image

          from media_tools.glb import write_glb

          BASE = "http://127.0.0.1:8080"
          for _ in range(60):
              try:
                  urllib.request.urlopen(f"{BASE}/healthz", timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          picture = io.BytesIO()
          Image.new("RGB", (64, 64), "white").save(picture, format="PNG")
          triangle = {
              "asset": {"version": "2.0"},
              "buffers": [{"byteLength": 36}],
              "bufferViews": [{"buffer": 0, "byteLength": 36}],
              "accessors": [
                  {"bufferView": 0, "componentType": 5126, "count": 3, "type": "VEC3",
                   "min": [0, 0, 0], "max": [1, 1, 0]}
              ],
              "meshes": [{"primitives": [{"attributes": {"POSITION": 0}}]}],
              "nodes": [{"mesh": 0}],
              "scenes": [{"nodes": [0]}],
          }
          model = write_glb(triangle, struct.pack("<9f", 0, 0, 0, 1, 0, 0, 0, 1, 0))
          for path, body in (("/cutout?method=isnet", picture.getvalue()), ("/mesh?triangles=1000", model)):
              with urllib.request.urlopen(urllib.request.Request(BASE + path, data=body), timeout=600) as response:
                  print(path, response.status)
          EOF
      - if: failure()
        run: docker logs smoke
      - name: Scan the image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          image-ref: media-tools:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: for tag in $TAGS; do docker push "$tag"; done

  publish-rig:
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ghcr.io/${{ github.repository }}-rig
          tags: |
            type=ref,event=branch
            type=raw,value=latest
            type=sha
      # We free space because the loaded CUDA image outgrows the runner's default disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./rig
          load: true
          tags: |
            unirig:scan
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rig
          cache-to: type=gha,scope=rig,mode=max
      # We import every package and UniRig stage module as the pod runs them, so a missing
      # shared library fails here. The runner has no GPU, so this skips CUDA kernels.
      - name: Import the rig packages and UniRig stages
        run: |
          run() { docker run --rm --user 1000:1000 --network none --read-only --tmpfs /tmp -w /opt/unirig/repo unirig:scan python -c "$1"; }
          run "import bpy, spconv.pytorch, torch_scatter, torch_cluster, flash_attn, open3d, pyrender, lightning, transformers, trimesh, fast_simplification"
          run "import src.data.extract, src.inference.merge, src.data.dataset, src.model.parse, src.system.parse"
      - name: Scan the rig image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          image-ref: unirig:scan
          format: json
          output: rig-trivy.json
      - name: Scan its base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          skip-setup-trivy: true
          image-ref: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          format: json
          output: base-trivy.json
      # We fail on fixable criticals in what we install and report the ones the base brings
      # or rig/accepted-vulns.txt lists.
      - name: Fail on fixable criticals we install
        run: |
          jq -r --slurpfile base base-trivy.json --rawfile accepted rig/accepted-vulns.txt \
            -f .github/trivy-report.jq rig-trivy.json > trivy-report.md
          cat trivy-report.md >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.md
          ! grep -q '| ours | CRITICAL | yes |' trivy-report.md
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rig-trivy
          path: |
            rig-trivy.json
            base-trivy.json
            trivy-report.md
      - name: Push the scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: for tag in $TAGS; do docker push "$tag"; done
